# =============================================================
#  주도 섹터 · 주도주 자동 탐색 시스템 — 설정 파일
#  이 파일만 수정하면 동작을 바꿀 수 있습니다.
# =============================================================

# ── 분석 기간 ─────────────────────────────────────────────────
date:
  target_date: null          # null = 오늘 기준 최근 거래일 자동, "20260427" 형식도 가능
  lookback_days: 30          # 거래대금 이동평균 계산용 과거 기간 (거래일 기준)

# ── 출력 필터 ─────────────────────────────────────────────────
filter:
  top_n_sectors: 5           # 출력할 HOT 섹터 개수
  top_n_stocks: 3            # 섹터별 주도주 출력 개수
  vol_ma_top_n: 200          # 거래대금 이동평균 계산 대상 종목 수 (속도↔정확도 trade-off)

# ── 종목 최소 조건 ────────────────────────────────────────────
universe:
  min_volume_billion: 50     # 최소 거래대금 (억원)
  min_cap_billion: 500       # 최소 시가총액 (억원)
  markets:                   # 분석 대상 시장
    - KOSPI
    - KOSDAQ

# ── 핫 스코어 가중치 (합계 = 1.0) ────────────────────────────
scoring:
  weight_return: 0.35        # 당일 등락률
  weight_volume_surge: 0.35  # 거래대금 급증 배율 (당일 / 20일 평균)
  weight_momentum: 0.20      # 가격 모멘텀 (52주 신고가 근접도)
  weight_news: 0.10          # 뉴스 언급 빈도 (크롤링 사용 시)

# ── 주도주 필터 조건 ──────────────────────────────────────────
leader_filter:
  rsi_min: 50                # RSI 하한 (과매도 구간 제외)
  rsi_max: 75                # RSI 상한 (과열 구간 제외)
  rsi_period: 14             # RSI 계산 기간
  high52w_ratio_min: 0.80    # 52주 신고가 대비 현재가 최소 비율 (0.8 = 80%)
  volume_surge_min: 2.0      # 거래대금 급증 최소 배율 (20일 평균 대비)

# ── 알림 설정 ─────────────────────────────────────────────────
alert:
  email_enabled: false       # 이메일 알림 활성화 (.env: GMAIL_USER / GMAIL_APP_PASSWORD)
  telegram_enabled: false    # 텔레그램 알림 활성화
  telegram_token: ""         # BotFather에서 발급받은 Token
  telegram_chat_id: ""       # 알림 받을 Chat ID
  alert_top_n: 5             # 알림에 포함할 주도주 개수

# ── 스케줄러 설정 ─────────────────────────────────────────────
scheduler:
  enabled: false             # 자동 실행 활성화
  run_times:                 # 장중 실행 시각 (24h 형식)
    - "08:50"                # 장 시작 전
    - "10:00"
    - "12:00"
    - "14:00"
    - "15:40"                # 장 마감 후

# ── 저장 설정 ─────────────────────────────────────────────────
output:
  save_csv: true             # CSV 저장
  save_excel: true           # Excel 저장 (openpyxl 필요)
  output_dir: "./reports"    # 결과 저장 폴더
  filename_prefix: "sector_report"

# ── API 설정 ──────────────────────────────────────────────────
api:
  delay_sec: 0.3             # API 호출 간 딜레이 (초)
  retry_count: 3             # 실패 시 재시도 횟수
  timeout_sec: 10            # 요청 타임아웃 (초)
